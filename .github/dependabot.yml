---
version: 2

updates:
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: ":dependabot: github-actions"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: "uv"
    commit-message:
      prefix: ":dependabot: uv"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "uv"
    commit-message:
      prefix: ":dependabot: uv (demos)"
      include: "scope"
    cooldown:
      default-days: 7
    directory: "/docs/demos"
    schedule:
      interval: "daily"
