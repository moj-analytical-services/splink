name: Check minimal import

on:
  pull_request:
    paths:
      - "splink/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/check-minimal-import.yml"

permissions: {}

jobs:
  test:
    name: Check minimal import
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv (without cache)
        id: setup_uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install Python 3.12
        id: install_python312
        run: uv python install 3.12

      - name: Install dependencies
        id: install_dependencies
        run: uv sync --locked --python 3.12 --no-default-groups

      - name: Check core workflow without pandas
        run: |
          uv run --no-sync python - <<'PY'
          from importlib.util import find_spec

          from splink import DuckDBAPI, Linker, SettingsCreator
          import splink.comparison_library as cl

          assert find_spec("pandas") is None
          assert find_spec("numpy") is None
          data = DuckDBAPI().register([
              {"unique_id": 1, "name": "Alice"},
              {"unique_id": 2, "name": "Alice"},
              {"unique_id": 3, "name": "Bob"},
          ])
          settings = SettingsCreator(
              link_type="dedupe_only",
              comparisons=[cl.ExactMatch("name").configure(
                  m_probabilities=[0.9, 0.1], u_probabilities=[0.1, 0.9]
              )],
          )
          linker = Linker(data, settings)
          linker.training.estimate_u_using_random_sampling(max_pairs=10)
          predictions = linker.inference.predict()
          assert len(predictions.as_record_list()) == 3
          clusters = linker.clustering.cluster_pairwise_predictions_at_threshold(
              predictions, threshold_match_probability=0.5
          )
          assert len(clusters.as_record_list()) == 3
          PY

      - name: Check dependencies installed
        id: check_dependencies_installed
        run: uv pip list
