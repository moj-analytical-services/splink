name: Documentation

on:
  push:
    branches:
      - 'splink4_maintenance'
      - 'master'
  pull_request:
    branches:
      - 'splink4_maintenance'
      - 'master'
    paths:
      # files that affect the docs build:
      - .github/workflows/documentation.yml
      - docs/**
      - CONTRIBUTING.md
      - mkdocs.yml
      # and potentially dependencies - build is quick so shouldn't be too much pain to run this:
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        id: setup_uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false

      - name: Install Python 3.13
        id: install_python313
        run: uv python install 3.13

      - name: Install dependencies
        id: install_dependencies
        run: uv sync --python 3.13 --group docs

      - name: Render notebooks
        id: render_notebooks
        run: cd docs/demos && ./render_notebooks.sh -j 4 ..

      - name: Build documentation
        id: build_documentation
        run: uv run python -m mkdocs build

      - name: Collect generated notebooks
        run: |
          mkdir -p "$RUNNER_TEMP/colab-notebooks"
          find docs/demos -type f -name '*.ipynb' -exec cp --parents {} "$RUNNER_TEMP/colab-notebooks/" \;

      - name: Upload generated notebooks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: colab-notebooks
          path: ${{ runner.temp }}/colab-notebooks/
          if-no-files-found: error
          retention-days: 3

      - name: Upload built site
        id: upload_built_site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publish-notebooks:
    if: github.repository == 'moj-analytical-services/splink' && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download generated notebooks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: colab-notebooks
          path: ${{ runner.temp }}/colab-notebooks

      - name: Publish generated notebooks
        working-directory: ${{ runner.temp }}/colab-notebooks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$(find docs/demos -type f -name '*.ipynb' -print -quit)"

          git init --initial-branch=ipynbs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/demos
          git commit -m "Generated notebooks from $GITHUB_SHA"

          gh auth setup-git --hostname github.com
          git remote add origin https://github.com/moj-analytical-services/splink.git
          git push --force origin HEAD:refs/heads/ipynbs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/splink4_maintenance'
    needs: build
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Configure Pages
        id: configure_pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
